name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Deps
      run: sudo apt update && sudo apt install -y libcurl4-openssl-dev libtidy-dev libjansson-dev check locales-all
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --enable-werror
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  # The Docker integration stack depends on an external SMM image and a live
  # database, so it is kept in its own job: a flaky or unhealthy external
  # service fails only this job, not the unit tests, distcheck, or static
  # analysis above.
  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Start SMM stack
      run: |
        docker compose -f tests/docker-compose.yml up -d smm db
        ./tests/provision.sh
    - name: Run integration tests
      run: docker compose -f tests/docker-compose.yml run --rm tester
    - name: Dump stack logs on failure
      if: failure()
      run: docker compose -f tests/docker-compose.yml logs --no-color
    - name: Tear down
      if: always()
      run: docker compose -f tests/docker-compose.yml down -v

  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Deps
      run: |
        sudo apt update
        sudo apt install -y libcurl4-openssl-dev libtidy-dev libjansson-dev check \
          cppcheck clang-tidy bear

    # clang-format output is version-dependent; pin the exact version the tree
    # is formatted with so the formatting gate is reproducible.
    - name: Install pinned clang-format
      run: |
        python3 -m venv /tmp/clang-format-venv
        /tmp/clang-format-venv/bin/pip install -q clang-format==22.1.5

    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: build with compile database
      run: bear -- make
    - name: code checks (clang-format, cppcheck, clang-tidy)
      run: CLANG_FORMAT=/tmp/clang-format-venv/bin/clang-format ./check-code.sh
