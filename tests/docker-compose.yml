services:
  smm:
    image: canterburyairpatrol/search-management-map:latest
    environment:
      - DB_HOST=db
      - DB_USER=smm
      - DB_PASS=smmpass
      - DB_NAME=smm
      - DEBUG=True
      # The integration test and the healthcheck talk to SMM over plain HTTP on
      # :8080. Recent images default SECURE_SSL_REDIRECT on (gated by SECURE_SSL),
      # which 301-redirects every request to https://...:8080 where nothing is
      # listening for TLS, so the healthcheck and the test both fail. Disable it.
      - SECURE_SSL=False
      - SECRET_KEY=test-secret-key
      - ALLOWED_HOSTS=localhost,smm
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/accounts/login/')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tester:
    build:
      context: ..
      dockerfile: tests/Dockerfile.tester
    environment:
      - SMM_HOST=http://smm:8080
      - SMM_USER=testuser
      - SMM_PASS=testpass
    depends_on:
      smm:
        condition: service_healthy

  db:
    # Pinned by digest for reproducible CI. To refresh:
    #   docker buildx imagetools inspect postgis/postgis:18-3.6
    # then update the @sha256 below.
    image: postgis/postgis:18-3.6@sha256:c48eb5172cfb005ee094a522fe69f27f1ee9e184ba649fe068520a597fa30409
    environment:
      - POSTGRES_DB=smm
      - POSTGRES_USER=smm
      - POSTGRES_PASSWORD=smmpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm"]
      interval: 5s
      timeout: 5s
      retries: 5
