services:
  smm:
    image: canterburyairpatrol/search-management-map:latest
    environment:
      - DB_HOST=db
      - DB_USER=smm
      - DB_PASS=smmpass
      - DB_NAME=smm
      - DEBUG=True
      - SECRET_KEY=test-secret-key
      - ALLOWED_HOSTS=localhost,smm
    depends_on:
      db:
        condition: service_healthy

  tester:
    build:
      context: ..
      dockerfile: tests/Dockerfile.tester
    environment:
      - SMM_HOST=http://smm:8080
      - SMM_USER=testuser
      - SMM_PASS=testpass
    depends_on:
      - smm

  db:
    image: postgis/postgis:18-3.6
    environment:
      - POSTGRES_DB=smm
      - POSTGRES_USER=smm
      - POSTGRES_PASSWORD=smmpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm"]
      interval: 5s
      timeout: 5s
      retries: 5
